name: Release

on:
  push:
    tags:
    - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: macos-latest
        - platform: ubuntu-latest
        - platform: windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v7

    - name: Check version consistency
      shell: bash
      run: bash ci/check-version.sh "${GITHUB_REF_NAME#v}"

    - name: Install Linux dependencies
      if: matrix.platform == 'ubuntu-latest'
      run: bash ci/linux-deps.sh

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 26

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11

    - uses: dtolnay/rust-toolchain@stable
    - uses: swatinem/rust-cache@v2
      with:
        workspaces: src-tauri

    - name: Install frontend dependencies
      run: pnpm install --frozen-lockfile

    # tauri-action 一站式完成：构建打包（tauri.conf.json 的 beforeBuildCommand
    # 会先执行 pnpm build）→ 创建或复用当前 tag 的 GitHub Release → 上传产物。
    # 多平台并行时后完成的 job 自动向同一 Release 追加各自的产物。
    # Windows MSI 的版本由 tauri.conf.json > bundle.windows.wix.version 单独指定（数字格式）。
    # 未启用 tauri updater，关闭 latest.json 更新清单上传
    - name: Build and upload to GitHub Release
      uses: tauri-apps/tauri-action@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tagName: ${{ github.ref_name }}
        releaseName: Todo4Agent ${{ github.ref_name }}
        releaseBody: 完整更新日志见 [CHANGELOG.md](https://github.com/BlazeSnow/Todo4Agent/blob/main/CHANGELOG.md)
        prerelease: ${{ contains(github.ref_name, '-beta') }}
        uploadUpdaterJson: false
