# https://github.com/marketplace/actions/tauri-action

name: Release

on:
  push:
    tags:
    - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: 'macos-latest' # for Arm based macs (M1 and above).
          args: '--target aarch64-apple-darwin'
        - platform: 'macos-latest' # for Intel based macs.
          args: '--target x86_64-apple-darwin'
        - platform: 'ubuntu-22.04'
          args: ''
        - platform: 'windows-latest'
          args: ''

    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v7

    - name: check version consistency
      shell: bash
      run: bash ci/check-version.sh "${GITHUB_REF_NAME#v}"

    - name: setup node
      uses: actions/setup-node@v4
      with:
        node-version: 26

    - name: install Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
        targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

    - name: install dependencies (ubuntu only)
      if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

    - name: install frontend dependencies
      run: pnpm install --frozen-lockfile

    - uses: tauri-apps/tauri-action@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tagName: ${{ github.ref_name }}
        releaseName: Todo4Agent ${{ github.ref_name }}
        releaseBody: 完整更新日志见 [CHANGELOG.md](https://github.com/BlazeSnow/Todo4Agent/blob/main/CHANGELOG.md)
        prerelease: ${{ contains(github.ref_name, '-beta') }}
        uploadUpdaterJson: false
